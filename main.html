<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>

  <!-- Bootstrap -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

  <!-- Icons + Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@700&display=swap" rel="stylesheet">

  <!-- Custom -->
  <link rel="stylesheet" href="Asset/style.css">
</head>

<body class="content">

  <!-- Header -->
  <header><br></header>

  <div class="main row">
    <!-- Left Side -->
    <div class="jumbotron col">
      <h1 class="display-4">Motivational Todo List</h1>
      <p class="lead">Type what you gotta do. Knock it out. Keep going.</p>

      <hr>
      <h5>Completed: <span id="points">0</span></h5>
      <h5>Current Todos: <span id="todo-count">0</span></h5>
      <hr>

      <!-- Add Todo -->
      <form id="todo-form">
        <label for="todo-text">Add a Todo:</label>
        <input type="text" id="todo-text" name="todo-text" placeholder="What are we tackling?" class="form-control text-center">
      </form>

      <br>

      <!-- Todo List -->
      <ul class="list-group list-group-flush" id="todo-list"></ul>
    </div>

    <!-- Right Side -->
    <div class="jumbotron col">
      <div class="row">

        <!-- Timer -->
        <div class="timerCard card">
          <div class="card-body">
            <h5>Countdown Timer</h5>
            <h1 id="time"></h1>
            <p>Any leftover time goes to your score. Move smart.</p>
            <button onclick="startTimer()" id="timerButton" class="btn btn-primary btn-lg">Start</button>
          </div>
        </div>

        <br>

        <!-- Quotes -->
        <div class="quotesCard card">
          <img id="motivationImage" class="img-fluid" alt="Motivation">
          <div class="card-body">
            <h5>Motivational Quote</h5>
            <p id="quote">Hit the button for a boost.</p>
            <button id="motivationButton" class="btn btn-primary btn-lg">Motivate Me</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="card-body">
      Powered by Pixelbay + Quote Garden<br>
      <a href="https://ak0501.github.io/Project-Uno/">Source Code</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <script src="Asset/script.js"></script>

</body>
</html>
