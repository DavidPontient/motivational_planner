<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="landing.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div id="card-1" class="flip-card">

        <!-- FRONT -->
        <div class="front p-4">
            <div class="row align-items-center">
                <div class="col-md-6 text-center">
                    <canvas id="canvas" width="300" height="300"></canvas>
                    <button id="getQuote" class="btn btn-outline-light mt-3">Get Quote</button>
                </div>
                <div class="col-md-6">
                    <blockquote id="quoteBlock">
                        <p>You don't have to see the whole staircase, just take the first step.</p>
                        <cite>Martin Luther King Jr.</cite>
                    </blockquote>
                </div>
            </div>
        </div>

        <!-- BACK -->
        <div class="back p-4 text-white">
            <div class="row">
                <div class="col-md-12 d-flex justify-content-center align-items-center">
                    <a href="main.html" class="btn btn-danger btn-lg">Enter Main App</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="landing.js"></script>
</body>
</html>
