<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Icons + Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Pacifico&display=swap" rel="stylesheet">

    <!-- jQuery + Flip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.rawgit.com/nnattawat/flip/master/dist/jquery.flip.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="landing.css">
</head>

<body>

    <div class="container" style="padding-top: 100px;">
        <div id="card-1">

            <!-- FRONT -->
            <div class="front">
                <div class="container-fluid clock-quote">
                    <div class="info">
                        <div class="row">

                            <!-- Clock -->
                            <div class="col-md-6">
                                <div class="clock">
                                    <canvas id="canvas" width="400" height="400"
                                        style="background-color: rgb(19,180,185)">
                                    </canvas>
                                </div>
                            </div>

                            <!-- Quote -->
                            <div class="col-md-6">
                                <blockquote class="wp-block-quote">
                                    <p>You don't have to see the whole staircase, just take the first step.</p>
                                    <cite>Martin Luther King Jr.</cite>
                                </blockquote>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- BACK -->
            <div class="back">
                <div class="container-fluid clock-quote">
                    <div class="info">
                        <div class="row">

                            <!-- Button -->
                            <div class="col-md-6">
                                <div class="enterTask d-flex justify-content-center align-items-center" style="height:405px;">
                                    <a href="main.html" class="btn btn-primary btn-lg">Enter Main App</a>
                                </div>
                            </div>

                            <!-- How To -->
                            <div class="col-md-6" style="padding-top: 80px;">
                                <h3 class="text-center">How To</h3>
                                <ul>
                                    <li>Enter your task</li>
                                    <li>Boost your motivation with quotes</li>
                                    <li>Use the timer to stay focused</li>
                                    <li>Track completed tasks</li>
                                    <li>Feel good about progress</li>
                                    <li>Consistency = Success</li>
                                </ul>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom JS -->
    <script src="landing.js"></script>
</body>

</html>
