<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Timer Landing</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&family=Pacifico&display=swap" rel="stylesheet">

    <!-- jQuery + Flip Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
    <script src="https://cdn.rawgit.com/nnattawat/flip/master/dist/jquery.flip.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="landing.css">
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div id="card-1" class="flip-card">

            <!-- FRONT -->
            <div class="front p-4">
                <div class="row align-items-center">
                    <div class="col-md-6 text-center">
                        <canvas id="canvas" width="300" height="300"></canvas>
                        <button id="getQuote" class="btn btn-outline-light mt-3">Get Quote</button>
                    </div>
                    <div class="col-md-6">
                        <blockquote id="quoteBlock">
                            <p>You don't have to see the whole staircase, just take the first step.</p>
                            <cite>Martin Luther King Jr.</cite>
                        </blockquote>
                    </div>
                </div>
            </div>

            <!-- BACK -->
            <div class="back p-4 text-white">
                <div class="row">
                    <div class="col-md-6 d-flex justify-content-center align-items-center">
                        <a href="main.html" class="btn btn-danger btn-lg">Enter Main App</a>
                    </div>
                    <div class="col-md-6 pt-3">
                        <h3 class="text-center mb-3">How To</h3>
                        <ul>
                            <li>Enter your task</li>
                            <li>Boost your motivation with quotes</li>
                            <li>Use the timer to stay focused</li>
                            <li>Track completed tasks</li>
                            <li>Feel good about progress</li>
                            <li>Consistency = Success</li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom JS -->
    <script src="landing.js"></script>
</body>

</html>
